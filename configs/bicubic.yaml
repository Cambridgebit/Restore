dataset:
  root: null                # null -> $BIOSR_ROOT -> protocol default (resolved in code)
  scale: 2
  structures: [CCPs, ER, Microtubules, F-actin]
  held_out_structure: CCPs  # Fold 1; fold_2 ER, fold_3 Microtubules, fold_4 F-actin
  signal_levels: all        # "all" or list of ints
  patch_size: 32            # unused by bicubic (epochs=0), kept for config parity
  normalization: per_image_minmax
model:
  name: bicubic             # non-learning reference baseline (AGENT.md §7)
  scale: 2
training:
  seed: 42
  batch_size: 16
  learning_rate: 1.0e-4
  epochs: 0                 # eval-only: skip training, evaluate the held-out fold directly
  num_workers: 4
  val_fraction: 0.1
  val_every: 1
  weight_decay: 0.0
  grad_clip: null
  device: auto
loss:
  charbonnier: 1.0          # unused (no training), kept for required config sections
  ssim: 0.1
  gradient: 0.1
  fourier: 0.0
  charbonnier_eps: 1.0e-3
  ssim_window: 11
augmentation:
  hflip: true               # unused (no training)
  vflip: true
  rot90: true
  intensity_range: [0.9, 1.1]
  noise_max_sigma: 0.0
  morphology_ood: false
eval:
  tile: 256
  overlap: 32
  edge_percentile: 99.0
  tolerance_px: 2
  frc_threshold: 0.14285714285714285   # 1/7-bit criterion
  ssim_window: 11
output_dir: runs
